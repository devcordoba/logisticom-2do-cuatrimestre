<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="img/Logos/LogistiCom-favicon.ico" type="image/x-icon" sizes="230x230">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img class="navbar-logo" src="img/Logos/Logo-1.png" alt="Logo">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse mt-3 mt-md-0" id="navbarNav">

                <ul class="navbar-nav me-auto mb-lg-0 ms-lg-5">
                    <li class="nav-item mx-2"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item mx-2"><a class="nav-link" href="nosotros.html">Quiénes somos</a></li>
                    <li class="nav-item mx-2"><a class="nav-link active" href="servicios.html">Servicios</a></li>
                    <li class="nav-item mx-2"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item mx-2"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>

                <ul class="navbar-nav mb-3 mt-3 mt-md-0 mb-lg-0">
                    <li class="nav-item">
                        <button id="logoutBtn" class="btn btn-outline-light">Cerrar sesión</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex justify-content-center align-items-start mt-5">
        <section class="container-lg rounded overflow-hidden shadow p-4 bg-dark text-white m-5">
            <div class="text-center mb-4">
                <h4>Bienvenido a LogistiCom Dashboard</h4>
                <p>Información de usuario logueado:</p>
            </div>

            <div id="userInfo" class="row justify-content-center">
                <div class="col-12 col-md-6 mb-3">
                    <div class="p-3 rounded bg-secondary">
                        <strong>Nombre:</strong> <span id="nombreUsuario"></span>
                    </div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <div class="p-3 rounded bg-secondary">
                        <strong>Apellido:</strong> <span id="apellidoUsuario"></span>
                    </div>
                </div>
                <div class="col-12 col-md-6 mb-3">
                    <div class="p-3 rounded bg-secondary">
                        <strong>Email:</strong> <span id="emailUsuario"></span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <i class="bi bi-box-seam fs-2"></i>
        <p class="mb-0 mt-2">&copy; 2025 LogistiCom - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
