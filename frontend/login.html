<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="img/Logos/LogistiCom-favicon.ico" type="image/x-icon" sizes="230x230">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img class="navbar-logo" src="img/Logos/Logo-1.png" alt="Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Quiénes somos</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item nav-login"><a class="nav-link active" href="login.html"><i
                                class="bi bi-person px-2"></i>Login / Registro</a></li>
                </ul>
            </div>
        </div>

    </nav>
    <main>
        <div class="login-container">
            <div class="login-form">
                <div class="login-text">
                    <div class="login-head">
                        <h4 class="text-white regular">Logisti<span style="color: #4FC3F7;">Com</span></h4>
                    </div>
                    <div class="login-body">
                        <p class="card-title text-white mt-5">Iniciar Sesión</p>
                        <form id="loginForm" class="mt-2">
                            <div class="login-content">
                                <div class="form-group w-100 mt-3">
                                    <label for="email" class="text-white" style="font-size: 15px;">Correo electrónico
                                        *</label>
                                    <input type="email" name="email" id="email" class="input-pass"
                                        placeholder="tucorreo@ejemplo.com" required />
                                </div>
                                <div class="form-group w-100 mt-4">
                                    <label for="passwordInput" class="text-white" style="font-size: 15px;">Contraseña
                                        *</label>
                                    <div class="input-container">
                                        <input type="password" name="password" id="passwordInput" class="input-pass"
                                            placeholder="Tu contraseña" minlength="6" required />
                                    </div>
                                </div>
                            </div>

                            <div class="login-button">
                                <button type="submit" class="btn btn-lg px-5 text-white boton-enviar">
                                    Ingresar
                                </button>
                                <div
                                    class="form-group d-flex flex-column align-items-center justify-content-center mt-3">
                                    <a href="registro.html" class="forgot-pass mt-3"
                                        style="color: gainsboro; font-size: 13px; text-decoration: none;">
                                        No tienes cuenta? <strong style="color:#fff;">Registrate</strong>
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="login-img">

                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 footer">
        <i class="bi bi-box-seam fs-2"></i>
        <p class="mb-0 mt-2">&copy; 2025 LogistiCom - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
