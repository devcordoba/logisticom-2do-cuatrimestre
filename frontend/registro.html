<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="img/Logos/LogistiCom-favicon.ico" type="image/x-icon" sizes="230x230">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img class="navbar-logo" src="img/Logos/Logo-1.png" alt="Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Quiénes somos</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item nav-login"><a class="nav-link active" href="login.html"><i
                                class="bi bi-person px-2"></i>Login / Registro</a></li>
                </ul>
            </div>
        </div>

    </nav>
    <main>
        <div class="register-container">
            <div class="register-form">
                <div class="register-head">
                    <h4 class="text-white regular">Logisti<span style="color: #4FC3F7;">Com</span></h4>
                    <div class="line-head"></div>
                </div>

                <div class="register-estructure">
                    <form id="registerForm" class="w-100 d-flex">
                        <div class="register-text">
                            <div class="register-body">
                                <p class="card-title text-white">Registro</p>
                                <div class="register-content">
                                    <div class="form-group d-flex w-100 mt-3" style="gap: 10px;">
                                        <div class="w-50">
                                            <label class="text-white" style="font-size: 15px;">Nombre *</label>
                                            <input type="text" id="nombre" name="nombre" class="input-pass" required
                                                minlength="2" maxlength="30" />
                                        </div>
                                        <div class="w-50">
                                            <label class="text-white" style="font-size: 15px;">Apellido *</label>
                                            <input type="text" id="apellido" name="apellido" class="input-pass" required
                                                minlength="2" maxlength="30" />
                                        </div>
                                    </div>

                                    <div class="form-group w-100 mt-3">
                                        <label class="text-white" style="font-size: 15px;">Correo electrónico *</label>
                                        <input type="email" id="email" name="email" class="input-pass" required />
                                    </div>

                                    <div class="form-group w-100 mt-3">
                                        <label class="text-white" style="font-size: 15px;">Contraseña *</label>
                                        <div class="input-container">
                                            <input type="password" id="password" name="password" class="input-pass"
                                                required minlength="6" />
                                        </div>
                                    </div>

                                    <div class="form-group w-100 mt-4">
                                        <label class="text-white" style="font-size: 15px;">Confirmar contraseña
                                            *</label>
                                        <div class="input-container">
                                            <input type="password" id="passwordConfirm" name="passwordConfirm"
                                                class="input-pass" required minlength="6" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="register-text">
                            <div class="register-button">
                                <button type="submit" class="btn btn-lg px-5 text-white boton-enviar w-100">
                                    Registrarse
                                </button>

                                <hr class="mt-5" style="width: 100%; color: #fff;" />

                                <div class="mt-4">
                                    <button class="btn btn-outline-light w-100 mb-2">
                                        <i class="bi bi-google"></i> Registrarse con Google
                                    </button>
                                    <span class="text-light d-block text-center mt-2">o</span>
                                    <button class="btn btn-outline-light w-100 mt-2">
                                        <i class="bi bi-facebook"></i> Registrarse con Facebook
                                    </button>
                                </div>

                                <div class="form-group d-flex align-items-center justify-content-center mt-4">
                                    <a href="login.html" class="forgot-pass mt-1"
                                        style="color: gainsboro; font-size: 13px; text-decoration: none;">
                                        Ya tienes una cuenta? <strong style="color: #fff;">Inicia Sesión</strong>
                                    </a>
                                </div>
                            </div>
                        </div>
                </div>

    </main>
    <footer class="bg-dark text-white text-center py-3 footer">
        <i class="bi bi-box-seam fs-2"></i>
        <p class="mb-0 mt-2">&copy; 2025 LogistiCom - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
